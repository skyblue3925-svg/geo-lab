version: 1
audience: high_school
purpose: classroom_support
rules:
  max_stages: 4
  max_overlay_per_stage: 1
  prefer_process_transition_over_time_ratio: true
  prefer_front_or_teaching_view: true
  avoid_back_view: true
  avoid_multi_process_clutter: true

shared_output_contract:
  required_fields:
    - scenario
    - learning_goal
    - view_intent
    - process_sequence
    - quality_gate
  stage_fields:
    - id
    - title
    - dominant_process
    - overlay
    - student_caption
    - teacher_note
    - question

scenarios:
  - scenario: v_valley
    learning_goal: 융기 뒤 하천의 하방 침식과 사면 조정이 V자곡을 만든다는 점을 이해한다.
    view_intent: upstream_to_downstream
    process_sequence:
      - id: stage_1
        title: 높은 경사와 유수 에너지가 형성됨
        dominant_process: uplift
        overlay: tectonic
        student_caption: 먼저 경사가 커져 물이 빠르게 흐를 조건이 생깁니다.
        teacher_note: 융기 또는 상대적 고도 차가 커져 하방 침식 잠재력이 커지는 장면이다.
        question: 왜 경사가 커지면 하천 침식이 강해질까요?
      - id: stage_2
        title: 하천이 바닥을 집중적으로 깎음
        dominant_process: erosion
        overlay: erosion
        student_caption: 하천은 계곡 바닥을 아래쪽으로 먼저 깎습니다.
        teacher_note: 폭보다 깊이가 먼저 커지는 하방 침식 구간을 강조한다.
        question: 왜 계곡은 넓어지기보다 먼저 깊어질까요?
      - id: stage_3
        title: 사면이 무너져 계곡 측면이 조정됨
        dominant_process: diffusion
        overlay: change
        student_caption: 양쪽 사면도 함께 무너져 V자 모양이 뚜렷해집니다.
        teacher_note: 하천 침식만이 아니라 사면 이동이 함께 작용함을 보여준다.
        question: 하천만으로 V자곡이 완성될 수 있을까요?
      - id: stage_4
        title: V자 단면이 정리됨
        dominant_process: erosion_plus_slope_adjustment
        overlay: change
        student_caption: 바닥 침식과 사면 조정이 겹쳐 V자곡이 완성됩니다.
        teacher_note: 최종 결과보다 과정 순서를 되짚어 설명하게 한다.
        question: 바닥과 사면 중 어느 변화가 먼저 시작되었나요?
    quality_gate:
      - 바닥이 먼저 깊어지는 변화가 보여야 한다
      - 측면 사면 조정이 후속 과정으로 읽혀야 한다
      - 폭보다 깊이가 먼저 커지는 단면이 보이면 좋다

  - scenario: alluvial_fan
    learning_goal: 산지 출구에서 운반력이 떨어질 때 퇴적이 시작되어 선상지가 형성된다는 점을 이해한다.
    view_intent: front_from_basin
    process_sequence:
      - id: stage_1
        title: 산지에서 재료 공급이 늘어남
        dominant_process: weathering_and_supply
        overlay: tectonic
        student_caption: 산지에서 내려올 물질이 많이 만들어집니다.
        teacher_note: 급경사와 공급 조건을 먼저 읽게 한다.
        question: 왜 선상지는 산지와 평야의 경계에서 시작될까요?
      - id: stage_2
        title: 좁은 골짜기에서 운반이 집중됨
        dominant_process: transport
        overlay: transport
        student_caption: 물질은 아직 쌓이기보다 빠르게 이동합니다.
        teacher_note: 운반과 퇴적을 분리해서 설명하는 단계다.
        question: 아직 퇴적보다 운반이 우세한 이유는 무엇일까요?
      - id: stage_3
        title: 산지 출구에서 속도가 줄며 퇴적 시작
        dominant_process: deposition
        overlay: deposition
        student_caption: 흐름이 약해지며 퇴적물이 바깥으로 퍼집니다.
        teacher_note: 산지 출구와 퇴적 전면이 동시에 보여야 한다.
        question: 왜 퇴적은 하천 안 깊숙한 곳보다 출구 부근에서 두드러질까요?
      - id: stage_4
        title: 부채꼴 퇴적 지형이 정리됨
        dominant_process: deposition_and_spread
        overlay: change
        student_caption: 여러 번의 퇴적이 겹치며 선상지 모양이 완성됩니다.
        teacher_note: 침식 지형이 아니라 퇴적 지형이라는 점을 반드시 짚는다.
        question: 선상지는 침식 지형인가요, 퇴적 지형인가요?
    quality_gate:
      - 산지 출구가 반드시 보여야 한다
      - 분지 쪽으로 퍼지는 방향이 보여야 한다
      - 퇴적 오버레이가 부채꼴 전면으로 확장되어야 한다

  - scenario: folded_range
    learning_goal: 습곡 산지는 구조 운동이 만든 골격 위에 침식이 더해져 완성된다는 점을 이해한다.
    view_intent: oblique_along_structure
    process_sequence:
      - id: stage_1
        title: 압축으로 지층이 휘기 시작함
        dominant_process: folding
        overlay: tectonic
        student_caption: 지층이 눌리며 위아래로 굽어 오르기 시작합니다.
        teacher_note: 배사와 향사 개념의 출발 장면이다.
        question: 습곡은 왜 한 지점이 아니라 띠처럼 나타날까요?
      - id: stage_2
        title: 구조 골격이 드러남
        dominant_process: folding_plus_uplift
        overlay: tectonic
        student_caption: 산지의 큰 틀이 먼저 만들어집니다.
        teacher_note: 아직 침식보다 구조 운동이 우세한 단계다.
        question: 지금 보이는 능선은 침식 결과일까요, 구조 결과일까요?
      - id: stage_3
        title: 풍화와 침식이 구조를 따라 다르게 작용함
        dominant_process: differential_erosion
        overlay: erosion
        student_caption: 같은 산지라도 더 잘 깎이는 곳과 덜 깎이는 곳이 갈립니다.
        teacher_note: 구조와 차별 침식의 결합을 읽게 한다.
        question: 왜 골짜기 위치가 구조선과 관련될 수 있을까요?
      - id: stage_4
        title: 습곡 산지의 능선과 골짜기가 정리됨
        dominant_process: structure_plus_erosion
        overlay: change
        student_caption: 구조 운동이 만든 뼈대 위에 침식이 표면을 다듬어 현재 지형이 됩니다.
        teacher_note: 내적 작용과 외적 작용이 결합된 사례로 마무리한다.
        question: 습곡 산지의 최종 모양은 어떤 두 힘이 함께 만든 결과인가요?
    quality_gate:
      - 구조선이 사라지지 않아야 한다
      - 침식은 구조 골격 위에서 후속 과정으로 읽혀야 한다
      - 학생이 배사/향사와 능선/골짜기를 혼동하지 않게 설명이 붙어야 한다
