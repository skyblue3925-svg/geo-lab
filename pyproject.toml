[tool.poetry]
name = "geo-lab-ai"
version = "1.0.0"
description = "교육용 지형 시뮬레이션 - 하천 지형 모듈"
authors = ["Geo-Lab Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
streamlit = ">=1.28.0"
numpy = ">=1.24.0"
plotly = ">=5.18.0"
matplotlib = ">=3.7.0"
scipy = ">=1.11.0"
Pillow = ">=10.0.0"
kaleido = ">=0.2.1"
supabase = ">=2.0.0"
pyvista = { version = ">=0.46.4", optional = true }
stpyvista = { version = ">=0.1.4", optional = true }

[tool.poetry.extras]
viz3d = ["pyvista", "stpyvista"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
